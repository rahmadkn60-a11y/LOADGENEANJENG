<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanz Auto Uploader</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container">
        <h1>⚡ Vanz Auto Uploader</h1>
        <p class="sub">Paste kode Lua → Convert → Upload ke GitHub → Loadstring otomatis</p>

        <textarea id="inputCode" placeholder="-- Paste kode Lua/Luau lu di sini..."></textarea>

        <div class="row">
            <button id="btnConvert">🔄 Convert &amp; Upload</button>
            <button id="btnCopy" disabled>📋 Copy Loadstring</button>
        </div>

        <div class="output empty" id="output">Hasil loadstring bakal muncul di sini...</div>
        <div class="status" id="status"></div>

        <div class="footer">Powered by vanz Labs × Kairo</div>
    </div>

    <script src="/script.js"></script>
</body>
</html>
